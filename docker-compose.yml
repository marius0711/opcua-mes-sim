services:
  opcua-server:
    build: .
    command: python -m opcua_server.server
    ports:
      - "4840:4840"

  client:
    build: .
    command: python -m opcua_client.multi_run
    environment:
      - OPCUA_ENDPOINT=opc.tcp://opcua-server:4840/freeopcua/server/
      - OPCUA_MES_DB_PATH=/data/opcua_mes_sim.db
    volumes:
      - db-data:/data
    depends_on:
      - opcua-server

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - OPCUA_MES_DB_PATH=/data/opcua_mes_sim.db
    volumes:
      - db-data:/data

volumes:
  db-data:
